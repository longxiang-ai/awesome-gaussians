name: Deploy Paper Atlas

on:
  # The crawler pushes with GITHUB_TOKEN, which never triggers push events,
  # so rebuild after every "Update Papers" run instead.
  workflow_run:
    workflows: ["Update Papers"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'scripts/build_viz_data.py'
      - 'requirements-viz.txt'
      - 'data/keywords.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
    - name: 检查 GitHub Pages 设置
      id: pages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        settings_url="https://github.com/${{ github.repository }}/settings/pages"
        if response=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>&1); then
          build_type="$response"
        else
          build_type=""
          echo "Pages API: $response"
        fi
        if [ "$build_type" = "workflow" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ -z "$build_type" ]; then reason="GitHub Pages 尚未启用"; else reason="GitHub Pages 来源是 '${build_type}'（从分支部署），不是 GitHub Actions"; fi
          echo "::warning::${reason}，本次跳过部署。请在 ${settings_url} 将 Source 设置为 GitHub Actions。"
          {
            echo "### ⚠️ Paper Atlas 未部署"
            echo ""
            echo "- 原因：${reason}"
            echo "- 修复：打开 [Pages 设置](${settings_url})，把 **Build and deployment → Source** 设为 **GitHub Actions**，然后重新运行本工作流。"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: 检出代码
      uses: actions/checkout@v5
      with:
        ref: master

    - name: 设置Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-viz.txt

    - name: 安装依赖
      run: pip install -r requirements-viz.txt

    - name: 生成可视化数据
      run: python scripts/build_viz_data.py --out _site

    - name: 上传页面
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
